<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz Management System</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Online Quiz Management System</h1>
        <p>Test Your Knowledge</p>
    </header>

    <!-- Student Login -->
    <div class="container" id="loginPage">

        <h2>Student Login</h2>

        <p>Enter your name to start the quiz.</p>

    
        <input type="text" id="studentName"
               placeholder="Enter your full name">
               

        <p id="message"></p>

        <button onclick="startQuiz()">Start Quiz</button>

    </div>

    <!-- Quiz Section -->
    <div class="container hidden" id="quizPage">

        <div class="info">
            <span id="questionNumber"></span>

            <span>
                Time: <span id="timer">60</span> sec
            </span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <p id="answerMessage"></p>

        <button id="previousBtn" onclick="previousQuestion()">
            Previous
        </button>

        <button id="nextBtn" onclick="nextQuestion()">
            Next
        </button>

        <button id="submitBtn" onclick="submitQuiz()">
            Submit Quiz
        </button>

    </div>

    <!-- Result Section -->
    <div class="container hidden center" id="resultPage">

        <h2>Quiz Result</h2>

        <h3 id="welcome"></h3>

        <h1 id="score"></h1>

        <p id="percentage"></p>

        <p id="remark"></p>

        <button onclick="restartQuiz()">Try Again</button>

    </div>

    <footer>
        Online Quiz Management System | Student Project
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
